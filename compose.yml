# NOVA Studio isolado no Hostinger: sem portas públicas e sem tocar em outros serviços.
services:
  nova-studio:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8018:8018"
    environment:
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:?Defina STUDIO_API_TOKEN no arquivo .env}
      STUDIO_PUBLIC_DEPLOYMENT: "1"
      STUDIO_DATA_DIR: /app/storage
      NOVA_KOKORO_URL: ${NOVA_KOKORO_URL:-}
      NOVA_KOKORO_API_KEY: ${NOVA_KOKORO_API_KEY:-}
    volumes:
      - nova_storage:/app/storage
    mem_limit: 1536m
    cpus: "1.0"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/live',timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Opt-in and isolated; never started by the standard NOVA deployment.
  # Requires a separate host-resource check before enabling.
  kokoro-tts:
    profiles: ["voice"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    expose:
      - "8880"
    mem_limit: 2048m
    cpus: "1.5"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in CPU-only worker. Safe-by-default: no public ports, no restart loop,
  # and never launched by standard NOVA installer/deploy.
  kokoro-lite:
    profiles: ["voice-lite"]
    # Pull the tested image rather than compiling dependencies on the shared VPS.
    image: ghcr.io/goncalvesthiagoadm-dot/nova-voice-lite:v0.1.0
    build:
      context: .
      dockerfile: voice_lite/Dockerfile
    restart: "no"
    expose:
      - "8880"
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 80
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=96m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health',timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 2
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "8m"
        max-file: "2"
volumes:
  nova_storage:
